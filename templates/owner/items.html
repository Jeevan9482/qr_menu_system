<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Items Management</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --danger: #ef4444;
            --success: #10b981;
            --border: #e2e8f0;
            --bg: #f8fafc;
        }

        body {
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            min-height: 100vh;
            padding: 30px 20px;
            font-family: 'Segoe UI', sans-serif;
        }

        .container { max-width: 1200px; }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-section h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1e293b;
        }

        .back-btn {
            background: white;
            border: 2px solid var(--border);
            color: #475569;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
        }

        .form-section {
            background: white;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
        }

        .form-group label {
            font-size: .85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 14px;
            border-radius: 8px;
            border: 2px solid var(--border);
            font-size: .95rem;
        }

        .form-group textarea {
            resize: none;
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
        }

        .items-section {
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        table th {
            background: #f1f5f9;
            font-size: .8rem;
            text-transform: uppercase;
            padding: 14px;
        }

        table td {
            padding: 14px;
            vertical-align: middle;
            font-size: .9rem;
        }

        .desc-cell {
            max-width: 260px;
            color: #64748b;
            font-size: .85rem;
            line-height: 1.4;
        }

        .veg-icon, .nonveg-icon {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .veg-icon {
            border: 2px solid #16a34a;
        }
        .veg-icon::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #16a34a;
            border-radius: 50%;
        }

        .nonveg-icon {
            border: 2px solid #dc2626;
        }
        .nonveg-icon::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #dc2626;
            border-radius: 50%;
        }

        .delete-btn {
            background: var(--danger);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: .85rem;
        }

        .toggle-switch {
            width: 50px;
            height: 26px;
            position: relative;
        }

        .toggle-switch input { display: none; }

        .toggle-slider {
            background: #cbd5e1;
            border-radius: 20px;
            position: absolute;
            inset: 0;
            cursor: pointer;
        }

        .toggle-slider:before {
            content: '';
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: .3s;
        }

        input:checked + .toggle-slider {
            background: var(--success);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
    </style>
</head>

<body>
<div class="container">

    <!-- HEADER -->
    <div class="header-section">
        <h1><i class="fas fa-utensils"></i> Menu Items</h1>
        <a href="/orders/dashboard/" class="back-btn">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
    </div>

    <!-- ADD ITEM FORM -->
    <div class="form-section">
        <h5 class="mb-3"><i class="fas fa-plus-circle"></i> Add New Item</h5>

        <form method="post" action="/menu/owner/items/add/" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-grid">

                <div class="form-group">
                    <label>Item Name</label>
                    <input name="name" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" rows="2"
                              placeholder="Short description (optional)"></textarea>
                </div>

                <div class="form-group">
                    <label>Price (₹)</label>
                    <input name="price" type="number" step="0.01" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select name="category" required>
                        <option value="">Select</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Food Type</label>
                    <select name="food_type" required>
                        <option value="veg">Veg</option>
                        <option value="nonveg">Non-Veg</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Item Image</label>
                    <input type="file" name="image" accept="image/*">
                </div>

                <div class="form-group">
                    <button class="add-btn">Add Item</button>
                </div>

            </div>
        </form>
    </div>

    <!-- ITEMS TABLE -->
    <div class="items-section">
        <table class="table mb-0">
            <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Category</th>
                <th>Type</th>
                <th>Price</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>

            {% for item in items %}
            <tr>
                <td><strong>{{ item.name }}</strong></td>
                <td class="desc-cell">
                    {{ item.description|default:"—" }}
                </td>
                <td>{{ item.category.name }}</td>
                <td>
                    {% if item.food_type == 'veg' %}
                        <span class="veg-icon"></span>
                    {% else %}
                        <span class="nonveg-icon"></span>
                    {% endif %}
                </td>
                <td>₹{{ item.price }}</td>
                <td>
                    <label class="toggle-switch">
                        <input type="checkbox" {% if item.is_available %}checked{% endif %}
                               onchange="toggleItemStatus('{{ item.id }}')">
                        <span class="toggle-slider"></span>
                    </label>
                </td>
                <td>
                    <a href="/menu/owner/items/delete/{{ item.id }}/"
                       class="delete-btn"
                       onclick="return confirm('Delete this item?')">
                        Delete
                    </a>
                </td>
            </tr>
            {% endfor %}

            </tbody>
        </table>
    </div>

</div>

<script>
function toggleItemStatus(itemId) {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = `/menu/owner/items/toggle/${itemId}/`;

    const csrf = document.querySelector('[name=csrfmiddlewaretoken]');
    form.appendChild(csrf.cloneNode());

    document.body.appendChild(form);
    form.submit();
}
</script>

</body>
</html>
